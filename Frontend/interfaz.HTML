<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Experto de Rutas</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root { --primary: #059669; --secundary: #3b82f6; --text: #1f2937; }
        body { 
            font-family: 'Poppins', sans-serif; margin: 0; padding: 20px;
            background: url('https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?q=80&w=2560') center/cover fixed;
            display: flex; justify-content: center;
        }
        .card { 
            background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(15px); 
            padding: 35px; border-radius: 24px; box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            width: 100%; max-width: 950px; 
        }
        .header { text-align: center; margin-bottom: 25px; }
        .grid-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; color: var(--text); font-size: 13px; text-transform: uppercase; }
        select, input[type="number"] { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #ddd; box-sizing: border-box; }
        .opciones-flex { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
        .chip { background: #f3f4f6; padding: 10px 15px; border-radius: 12px; cursor: pointer; font-size: 14px; border: 1px solid #ddd; display: flex; align-items: center; gap: 8px; font-weight: 500; transition: 0.2s; }
        .btn-buscar { width: 100%; background: var(--primary); color: white; padding: 18px; border: none; border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 20px; }
        #resultados { margin-top: 20px; padding: 20px; border-radius: 14px; display: none; border: 1px solid #10b981; background: #ecfdf5; color: #065f46; line-height: 1.6; }
        
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; display: none; }
        .chart-box { background: white; padding: 15px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #eee; height: 320px; position: relative; }
        .chart-box.full-width { grid-column: 1 / -1; height: 350px; }
        .chart-box h3 { font-size: 13px; margin: 0 0 10px 0; color: var(--text); text-align: center; }
        
        @media (max-width: 800px) { .grid-inputs, .dashboard { grid-template-columns: 1fr; } .chart-box.full-width { grid-column: auto; } }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h2>🌲 Sistema Experto de Rutas</h2>
        <p>Análisis de trayectos y costos corregidos</p>
    </div>

    <div class="grid-inputs">
        <div>
            <label>📍 Ciudad Origen</label>
            <select id="origen">
                <option value="zamora" selected>Zamora</option>
                <option value="morelia">Morelia</option>
                <option value="queretaro">Querétaro</option>
                <option value="jacona">Jacona</option>
                <option value="uruapan">Uruapan</option>
                <option value="patzcuaro">Pátzcuaro</option>
                <option value="tangancicuaro">Tangancícuaro</option>
            </select>
        </div>
        <div>
            <label>🎯 Ciudad Destino</label>
            <select id="destino">
                <option value="queretaro" selected>Querétaro</option>
                <option value="zamora">Zamora</option>
                <option value="morelia">Morelia</option>
                <option value="jacona">Jacona</option>
                <option value="uruapan">Uruapan</option>
                <option value="patzcuaro">Pátzcuaro</option>
                <option value="tangancicuaro">Tangancícuaro</option>
            </select>
        </div>
    </div>

    <div style="margin-top: 20px;">
        <label>💰 Presupuesto</label>
        <div class="opciones-flex">
            <label class="chip"><input type="radio" name="modo_p" value="limite" checked onchange="toggleP()"> 💵 Límite Máximo</label>
            <label class="chip"><input type="radio" name="modo_p" value="barata" onchange="toggleP()"> 🏷️ La más barata</label>
        </div>
        <div id="c_pres">
            <input type="number" id="pres_max" value="1000">
        </div>
    </div>

    <div style="margin-top: 20px;">
        <label>🛣️ Tipo de Camino</label>
        <div class="opciones-flex">
            <label class="chip"><input type="radio" name="tipo_r" value="cualquiera" checked> 🛤️ Cualquiera</label>
            <label class="chip"><input type="radio" name="tipo_r" value="libre"> 🌿 Libre</label>
            <label class="chip"><input type="radio" name="tipo_r" value="cuota"> 🛣️ Cuota</label>
            <label class="chip"><input type="radio" name="tipo_r" value="mixta"> 🔄 Mixta</label>
        </div>
    </div>

    <div style="margin-top: 20px;">
        <label>✨ Servicios Mínimos en Ruta</label>
        <div class="opciones-flex">
            <label class="chip"><input type="checkbox" id="srv_c" checked onchange="clickS(true)"> 🌎 Indiferente</label>
            <label class="chip"><input type="checkbox" id="srv_g" onchange="clickS(false)"> ⛽ Gasolinera</label>
            <label class="chip"><input type="checkbox" id="srv_p" onchange="clickS(false)"> 🛑 Paradero</label>
            <label class="chip"><input type="checkbox" id="srv_t" onchange="clickS(false)"> 📸 Turístico</label>
        </div>
    </div>

    <button class="btn-buscar" onclick="consultar()">Analizar Mejores Rutas</button>
    
    <div id="resultados"></div>

    <div class="dashboard" id="dashboard">
        <!-- Gráfica de Costo por Tramo -->
        <div class="chart-box full-width">
            <h3>📊 COSTO DEL TRAMO (MXN)</h3>
            <canvas id="cTramo"></canvas>
        </div>
        
        <div class="chart-box">
            <h3>💰 COMPARATIVA COSTO TOTAL</h3>
            <canvas id="cCostos"></canvas>
        </div>
        <div class="chart-box">
            <h3>🛤️ VÍAS UTILIZADAS</h3>
            <canvas id="cVias"></canvas>
        </div>
        <div class="chart-box full-width">
            <h3>✨ SERVICIOS DISPONIBLES</h3>
            <canvas id="cSrv"></canvas>
        </div>
    </div>

    <button id="btn-alt" class="btn-buscar" style="background:var(--secundary); display:none;" onclick="siguiente()">🔄 Ver otra ruta alterna</button>
</div>

<script>
    let rutas = []; let idx = 0; let charts = {};

    function toggleP() {
        const m = document.querySelector('input[name="modo_p"]:checked').value;
        document.getElementById('c_pres').style.display = (m === 'barata') ? 'none' : 'block';
    }

    function clickS(ind) {
        if(ind) {
            document.getElementById('srv_g').checked = false;
            document.getElementById('srv_p').checked = false;
            document.getElementById('srv_t').checked = false;
        } else {
            document.getElementById('srv_c').checked = false;
        }
    }

    async function consultar() {
        const payload = {
            origen: document.getElementById('origen').value,
            destino: document.getElementById('destino').value,
            modo_presupuesto: document.querySelector('input[name="modo_p"]:checked').value,
            presupuesto_max: parseInt(document.getElementById('pres_max').value) || 0,
            tipo_ruta: document.querySelector('input[name="tipo_r"]:checked').value,
            servicios: {
                cualquiera: document.getElementById('srv_c').checked,
                gasolinera: document.getElementById('srv_g').checked,
                paradero: document.getElementById('srv_p').checked,
                turistico: document.getElementById('srv_t').checked
            }
        };

        try {
            const res = await fetch('http://localhost:5000/buscar-ruta', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (data.rutas && data.rutas.length > 0) {
                rutas = data.rutas; idx = 0;
                document.getElementById('dashboard').style.display = 'grid';
                mostrar();
            } else {
                alert("No se encontraron rutas con estas condiciones.");
                document.getElementById('resultados').style.display = 'none';
                document.getElementById('dashboard').style.display = 'none';
            }
        } catch (e) { alert("Error: El servidor no responde."); }
    }

    function mostrar() {
        const r = rutas[idx];
        const resDiv = document.getElementById('resultados');
        resDiv.style.display = 'block';
        resDiv.innerHTML = `✅ <b>Opción ${idx+1} de ${rutas.length}</b><br>
                            📍 <b>Trayecto:</b> ${r.camino}<br>
                            💵 <b>Costo:</b> $${r.costo} MXN | 📏 <b>Distancia Total:</b> ${r.distanciaTotal} km`;
        
        document.getElementById('btn-alt').style.display = rutas.length > 1 ? 'block' : 'none';
        render(r);
    }

    function render(ruta) {
        // 1. GRAFICA COSTO POR TRAMO
        gen('cTramo', 'bar', 'Costo por Tramo ($)', 
            ruta.tramos.map(t => `${t.o} ➔ ${t.d} (${t.tipo})`),
            ruta.tramos.map(t => t.costo), 
            ruta.tramos.map(t => t.tipo === 'Libre' ? '#10b981' : '#ef4444'));

        // 2. COMPARATIVA TOTAL
        gen('cCostos', 'bar', 'Costo Total', 
            rutas.map((_, i) => `Ruta ${i+1}`), 
            rutas.map(x => x.costo), 
            rutas.map((_, i) => i === idx ? '#059669' : '#d1d5db'));

        // 3. VÍAS
        const libs = ruta.tramos.filter(t => t.tipo === 'Libre').length;
        const cuos = ruta.tramos.filter(t => t.tipo === 'Cuota').length;
        gen('cVias', 'pie', 'Vías', ['Libre', 'Cuota'], [libs, cuos], ['#10b981', '#ef4444']);

        // 4. SERVICIOS
        gen('cSrv', 'bar', 'Servicios', ruta.ciudades.map(c => c.nombre), [
            { label: '⛽ Gas', data: ruta.ciudades.map(c => c.servicios.includes('gasolinera')?1:0), backgroundColor: '#fbbf24' },
            { label: '🛑 Paradero', data: ruta.ciudades.map(c => c.servicios.includes('paradero')?1:0), backgroundColor: '#f87171' },
            { label: '📸 Turístico', data: ruta.ciudades.map(c => c.servicios.includes('turistico')?1:0), backgroundColor: '#818cf8' }
        ]);
    }

    function gen(id, type, label, labels, data, colors) {
        if (charts[id]) charts[id].destroy();
        const config = {
            type, data: { labels, datasets: Array.isArray(data) && typeof data[0] === 'object' ? data : [{ label, data, backgroundColor: colors, borderColor: colors, tension: 0.3, fill: true }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { title: { display: true, text: label } } }
        };
        charts[id] = new Chart(document.getElementById(id), config);
    }

    function siguiente() {
        idx = (idx + 1) % rutas.length;
        mostrar();
    }
</script>
</body>
</html>

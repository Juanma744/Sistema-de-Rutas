<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Experto de Rutas Turísticas</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #059669; /* Verde esmeralda */
            --primary-hover: #047857;
            --secundary: #3b82f6; /* Azul para el botón de alterna */
            --secundary-hover: #2563eb;
            --text-dark: #1f2937;
            --text-light: #4b5563;
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex; 
            justify-content: center; 
            align-items: center;
            box-sizing: border-box;
            background-image: url('https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?q=80&w=2560'); 
            background-size: cover; 
            background-position: center; 
            background-repeat: no-repeat;
            background-attachment: fixed; 
        }

        .card { 
            background: rgba(255, 255, 255, 0.82); 
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px);
            padding: 40px; 
            border-radius: 24px; 
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35); 
            width: 100%; 
            max-width: 580px; 
        }

        .header { text-align: center; margin-bottom: 30px; }
        .header h2 { color: var(--text-dark); margin: 0; font-size: 28px; font-weight: 700; }
        .header p { color: var(--text-light); margin-top: 5px; font-size: 14px; font-weight: 500; }

        .grid-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        
        label { display: block; font-weight: 600; margin-bottom: 8px; color: var(--text-dark); font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }

        select, input[type="number"] { 
            width: 100%; padding: 12px 15px; border: 1px solid rgba(0,0,0,0.1); 
            border-radius: 12px; box-sizing: border-box; font-size: 15px; 
            font-family: 'Poppins', sans-serif; transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.7);
        }

        select:focus, input[type="number"]:focus {
            outline: none; border-color: var(--primary); background: #fff;
            box-shadow: 0 0 0 4px rgba(5, 150, 105, 0.15);
        }

        .opciones-flex { display: flex; gap: 10px; flex-wrap: wrap; }

        .chip {
            display: flex; align-items: center; gap: 8px; background: rgba(255, 255, 255, 0.6);
            padding: 10px 14px; border: 1px solid rgba(0,0,0,0.08); border-radius: 10px;
            cursor: pointer; transition: all 0.2s; font-size: 13px; font-weight: 600; color: var(--text-dark);
        }

        .chip:hover { background: #fff; border-color: var(--primary); }
        .chip input { accent-color: var(--primary); margin: 0; cursor: pointer; }

        .btn-buscar { 
            width: 100%; background: var(--primary); color: white; padding: 18px; border: none; 
            border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer; 
            transition: all 0.3s; margin-top: 10px; box-shadow: 0 4px 6px -1px rgba(5, 150, 105, 0.4);
        }
        .btn-buscar:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(5, 150, 105, 0.5); }

        .btn-alterna {
            background: var(--secundary); box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.4); display: none; margin-top: 10px;
        }
        .btn-alterna:hover { background: var(--secundary-hover); box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.5); }

        #resultados { margin-top: 25px; padding: 20px; border-radius: 14px; display: none; animation: slideUp 0.4s ease; font-size: 14px; line-height: 1.6; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .exito { background: rgba(236, 253, 245, 0.95); border: 1px solid #10b981; color: #065f46; }
        .error { background: rgba(254, 242, 242, 0.95); border: 1px solid #ef4444; color: #991b1b; }
        .cargando { text-align: center; color: var(--primary); font-weight: 600; display: none; margin-top: 20px; }

        @media (max-width: 500px) { .grid-inputs { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h2>🌲 Rutas Turísticas</h2>
        <p>Sistema Experto de Navegación</p>
    </div>
    
    <div class="grid-inputs">
        <div class="form-group">
            <label>📍 Ciudad Origen</label>
            <select id="origen">
                <option value="">Seleccionar...</option>
                <option value="uruapan">Uruapan</option>
                <option value="morelia">Morelia</option>
                <option value="patzcuaro">Pátzcuaro</option>
                <option value="zamora">Zamora</option>
                <option value="jacona">Jacona</option>
                <option value="tangancicuaro">Tangancícuaro</option>
                <option value="queretaro">Querétaro</option>
            </select>
        </div>

        <div class="form-group">
            <label>🎯 Ciudad Destino</label>
            <select id="destino">
                <option value="">Seleccionar...</option>
                <option value="uruapan">Uruapan</option>
                <option value="morelia">Morelia</option>
                <option value="patzcuaro">Pátzcuaro</option>
                <option value="zamora">Zamora</option>
                <option value="jacona">Jacona</option>
                <option value="tangancicuaro">Tangancícuaro</option>
                <option value="queretaro">Querétaro</option>
            </select>
        </div>
    </div>

    <div class="form-group">
        <label>💰 Presupuesto</label>
        <div class="opciones-flex" style="margin-bottom: 10px;">
            <label class="chip"><input type="radio" name="modo_presupuesto" value="limite" checked onchange="togglePresupuesto()"> Limite máximo</label>
            <label class="chip"><input type="radio" name="modo_presupuesto" value="barata" onchange="togglePresupuesto()"> La más barata</label>
        </div>
        <input type="number" id="presupuesto_max" placeholder="Ingresa tu presupuesto (Ej: 500)">
    </div>

    <div class="form-group">
        <label>🛣️ Tipo de Camino</label>
        <div class="opciones-flex">
            <label class="chip"><input type="radio" name="tipo_ruta" value="cualquiera" checked> 🛤️ Cualquiera</label>
            <label class="chip"><input type="radio" name="tipo_ruta" value="libre"> Libre</label>
            <label class="chip"><input type="radio" name="tipo_ruta" value="cuota"> Cuota</label>
            <label class="chip"><input type="radio" name="tipo_ruta" value="mixta"> Mixta</label>
        </div>
    </div>

    <div class="form-group">
        <label>✨ Servicios Requeridos en Ruta</label>
        <div class="opciones-flex">
            <label class="chip"><input type="checkbox" id="srv_cualquiera" checked onchange="toggleServicios(true)"> 🌎 Indiferente</label>
            <label class="chip"><input type="checkbox" id="srv_gasolinera" onchange="toggleServicios(false)"> ⛽ Gasolinera</label>
            <label class="chip"><input type="checkbox" id="srv_paradero" onchange="toggleServicios(false)"> 🛑 Paradero</label>
            <label class="chip"><input type="checkbox" id="srv_turistico" onchange="toggleServicios(false)"> 📸 Turístico</label>
        </div>
    </div>

    <button class="btn-buscar" onclick="consultarBackend()">Analizar Mejores Rutas</button>
    
    <div id="indicador-carga" class="cargando">⚙️ Calculando rutas disponibles...</div>
    <div id="resultados"></div>
    
    <button id="btn-alterna" class="btn-buscar btn-alterna" onclick="mostrarSiguienteRuta()">🔄 Ver otra ruta alterna</button>
</div>

<script>
    // Variables globales para guardar las rutas que nos pase Python
    let rutasEncontradas = [];
    let indiceRutaActual = 0;

    // Lógica visual del presupuesto
    function togglePresupuesto() {
        const modo = document.querySelector('input[name="modo_presupuesto"]:checked').value;
        const inputCosto = document.getElementById('presupuesto_max');
        if(modo === 'barata') {
            inputCosto.style.display = 'none';
        } else {
            inputCosto.style.display = 'block';
        }
    }

    // Lógica visual de los servicios
    function toggleServicios(esCualquiera) {
        if (esCualquiera) {
            document.getElementById('srv_gasolinera').checked = false;
            document.getElementById('srv_paradero').checked = false;
            document.getElementById('srv_turistico').checked = false;
        } else {
            document.getElementById('srv_cualquiera').checked = false;
        }
    }

    async function consultarBackend() {
        const origen = document.getElementById('origen').value;
        const destino = document.getElementById('destino').value;
        const modo_presupuesto = document.querySelector('input[name="modo_presupuesto"]:checked').value;
        const presupuesto_max = document.getElementById('presupuesto_max').value;
        const tipo_ruta = document.querySelector('input[name="tipo_ruta"]:checked').value;
        
        const srv_cualquiera = document.getElementById('srv_cualquiera').checked;
        const srv_gas = document.getElementById('srv_gasolinera').checked;
        const srv_paradero = document.getElementById('srv_paradero').checked;
        const srv_turistico = document.getElementById('srv_turistico').checked;

        const divRes = document.getElementById('resultados');
        const divCarga = document.getElementById('indicador-carga');
        const btnAlterna = document.getElementById('btn-alterna');

        // Validaciones
        if (!origen || !destino) {
            mostrarMensaje('error', '❌ <b>Datos incompletos:</b> Selecciona origen y destino.');
            return;
        }
        if (modo_presupuesto === 'limite' && !presupuesto_max) {
            mostrarMensaje('error', '❌ <b>Falta presupuesto:</b> Ingresa un límite o selecciona "La más barata".');
            return;
        }

        const datosConsulta = {
            origen, 
            destino, 
            modo_presupuesto,
            presupuesto_max: presupuesto_max ? parseInt(presupuesto_max) : 0,
            tipo_ruta, 
            servicios: { cualquiera: srv_cualquiera, gasolinera: srv_gas, paradero: srv_paradero, turistico: srv_turistico }
        };

        divRes.style.display = 'none';
        btnAlterna.style.display = 'none';
        divCarga.style.display = 'block';

        try {
            const response = await fetch('http://localhost:5000/buscar-ruta', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datosConsulta)
            });

            if (!response.ok) throw new Error();

            const res = await response.json();
            
            // Lógica para manejar múltiples rutas
            if (res.rutas && res.rutas.length > 0) {
                rutasEncontradas = res.rutas;
                indiceRutaActual = 0; // Reiniciamos el contador
                renderizarRuta(); // Mostramos la primera

                // Si hay más de una ruta, mostramos el botón azul
                if (rutasEncontradas.length > 1) {
                    btnAlterna.style.display = 'block';
                }
            } else {
                mostrarMensaje('error', `🛑 <b>Sin resultados:</b> No hay rutas con estas condiciones.`);
            }

        } catch (e) {
            mostrarMensaje('error', '🔌 <b>Servidor Offline:</b> Asegúrate de iniciar tu servidor Python.');
        } finally {
            divCarga.style.display = 'none';
        }
    }

    // Función que pinta la ruta actual en pantalla
    function renderizarRuta() {
        const ruta = rutasEncontradas[indiceRutaActual];
        // Indicador de qué opción estamos viendo (ej. 1 de 3)
        const contador = `<span style="float: right; font-size: 11px; background: rgba(0,0,0,0.1); padding: 3px 8px; border-radius: 10px;">Opción ${indiceRutaActual + 1} de ${rutasEncontradas.length}</span>`;
        
        mostrarMensaje('exito', `
            ${contador}
            ✅ <b>¡Análisis completado!</b><br><br>
            📍 <b>Trayecto:</b> ${ruta.camino}<br>
            💵 <b>Costo Estimado:</b> $${ruta.costo} MXN
        `);
    }

    // Función que se activa al picar el botón azul
    function mostrarSiguienteRuta() {
        indiceRutaActual++;
        // Si llegamos al final de la lista, volvemos a empezar desde la 0
        if (indiceRutaActual >= rutasEncontradas.length) {
            indiceRutaActual = 0;
        }
        renderizarRuta();
    }

    function mostrarMensaje(clase, html) {
        const div = document.getElementById('resultados');
        div.className = clase;
        div.innerHTML = html;
        div.style.display = 'block';
    }
</script>

</body>
</html>
